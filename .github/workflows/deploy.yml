name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Research & Publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Astro keeps its content data store (parsed + rendered markdown) in
      # node_modules/.astro. Restoring it after `npm ci` (which wipes
      # node_modules) lets Astro re-process only new/changed articles instead
      # of all of them on every build.
      - name: Restore Astro content cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-content-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/content.config.ts') }}-${{ github.sha }}
          restore-keys: |
            astro-content-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/content.config.ts') }}-

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
